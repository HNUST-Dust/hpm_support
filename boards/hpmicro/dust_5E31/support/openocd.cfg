# HPM5E00EVK-compatible 1 MiB XPI0 QSPI NOR.
# The SoC script defines _TARGET0 and reset_soc.
# The CMSIS-DAP connection was verified at 1 MHz; the probe script's 8 MHz
# setting caused JTAG reads to return all ones on this board.
adapter speed 1000
flash bank xpi0 hpm_xpi 0x80000000 0x100000 1 1 $_TARGET0 0xF3000000 0x5 0x1000

proc hpm5e31_init_clock {} {
    mww 0xF4000800 0xFFFFFFFF
    mww 0xF4000810 0xFFFFFFFF
    mww 0xF4000820 0xFFFFFFFF
    mww 0xF4000830 0xFFFFFFFF
}

$_TARGET0 configure -event reset-init {
    hpm5e31_init_clock
}

$_TARGET0 configure -event gdb-attach {
    reset halt
}
