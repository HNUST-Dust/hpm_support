# =============================================================================
# Docker Compose for Zephyr HPMicro Development (User Version)
# =============================================================================
# This file is for END USERS who pull the image from DockerHub.
# 
# QUICK START:
# 1. Download this file to an empty folder
# 2. Download and extract Zephyr SDK to the same folder
# 3. Run: docker compose up -d && docker compose exec zephyr-dev bash
#
# PREREQUISITES:
# - Docker and Docker Compose installed
# - Zephyr SDK downloaded and extracted (see instructions below)
# =============================================================================

services:
  zephyr-dev:
    # ==========================================================================
    # Image from DockerHub
    # ==========================================================================
    image: ${DOCKER_IMAGE:-swhpmicro/zephyr-hpmicro:latest}
    container_name: zephyr-hpmicro
    
    # ==========================================================================
    # Volume Mounts
    # ==========================================================================
    volumes:
      # Mount Zephyr SDK (REQUIRED)
      # SDK should be in the same directory as this docker-compose file
      # Download from: https://github.com/zephyrproject-rtos/sdk-ng/releases
      - ${ZEPHYR_SDK_PATH:-./zephyr-sdk-0.16.5}:/home/zephyr/zephyr_space/zephyr-sdk-0.16.5
      
      # Mount USB for debugging (required for west flash)
      - /dev/bus/usb:/dev/bus/usb
      
      # Optional: Mount a local directory for your own projects
      # - ./my_projects:/home/zephyr/zephyr_space/my_projects
      
      # Optional: Persist build output across container restarts
      # - ./build:/home/zephyr/zephyr_space/zephyr/build

    # ==========================================================================
    # Container Settings
    # ==========================================================================
    working_dir: /home/zephyr/zephyr_space
    stdin_open: true
    tty: true
    
    # Privileged mode for USB device access (CMSIS-DAP debugger, etc.)
    privileged: true
    
    # Add user to dialout and plugdev groups for serial access
    group_add:
      - dialout
      - plugdev

    # ==========================================================================
    # Environment Variables
    # ==========================================================================
    environment:
      - WORKSPACE=/home/zephyr/zephyr_space
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - ZEPHYR_SDK_VERSION=0.16.5

# =============================================================================
# SETUP INSTRUCTIONS
# =============================================================================
#
# STEP 1: Create a working directory
#   mkdir ~/zephyr-hpmicro && cd ~/zephyr-hpmicro
#
# STEP 2: Pull the image and extract docker-compose file
#   docker pull swhpmicro/zephyr-hpmicro:latest
#   docker run --rm swhpmicro/zephyr-hpmicro:latest cat /home/zephyr/docker-compose.yaml > docker-compose.yaml
#
# STEP 3: Download and extract Zephyr SDK
#   wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.5/zephyr-sdk-0.16.5_linux-x86_64.tar.xz
#   tar -xvf zephyr-sdk-0.16.5_linux-x86_64.tar.xz
#   cd zephyr-sdk-0.16.5 && ./setup.sh -t all -h -c && cd ..
#
# STEP 4: Start the container
#   docker compose up -d
#
# STEP 5: Enter the container
#   docker compose exec zephyr-dev bash
#
# STEP 6: Build and flash (inside container)
#   west build -b dust-hpm6750 samples/basic/blinky
#   west flash
#
# =============================================================================
# DIRECTORY STRUCTURE
# =============================================================================
#
# Your working directory should look like this:
#
#   ~/zephyr-hpmicro/
#   ├── docker-compose.yaml      <- This file
#   ├── zephyr-sdk-0.16.5/       <- Zephyr SDK (downloaded)
#   │   ├── setup.sh
#   │   ├── sdk_version
#   │   └── ...
#   └── my_projects/             <- Optional: Your custom projects
#
# Inside the container:
#
#   /home/zephyr/zephyr_space/
#   ├── bootloader/              <- (embedded in image)
#   ├── modules/                 <- (embedded in image)
#   ├── sdk_env/                 <- HPMicro SDK (embedded)
#   ├── sdk_glue/                <- (embedded in image)
#   ├── zephyr/                  <- Zephyr source (embedded)
#   │   └── samples/             <- Sample projects to build
#   ├── zephyr-sdk-0.16.5/       <- (mounted from host)
#   └── my_projects/             <- (optional, mounted from host)
#
# =============================================================================
# COMMON COMMANDS
# =============================================================================
#
# Build a sample:
#   west build -b <board> <sample_path>
#   
# Example boards:
#   - dust-hpm6750
#   - hpm6800evk
#   - hpm6200evk
#   - hpm6e00evk
#
# Example samples:
#   - samples/basic/blinky
#   - samples/hello_world
#   - samples/drivers/gpio
#
# Flash to target:
#   west flash
#
# Clean and rebuild:
#   west build -p always -b <board> <sample_path>
#
# Debug:
#   west debug
#
# =============================================================================
# TROUBLESHOOTING
# =============================================================================
#
# Q: "Zephyr SDK not found" error?
# A: Make sure zephyr-sdk-0.16.5 folder is in the same directory as this file
#    and run setup.sh inside the SDK folder first.
#
# Q: Cannot flash - "unable to find CMSIS-DAP device"?
# A: 1. Check debugger is connected: lsusb | grep -i dap
#    2. Make sure privileged: true is set
#    3. Check /dev/bus/usb is mounted
#
# Q: Permission denied on serial device?
# A: Add your user to dialout group on host:
#    sudo usermod -aG dialout $USER
#    Then logout and login again.
#
# Q: Using a different SDK version?
# A: Set the environment variable before starting:
#    export ZEPHYR_SDK_PATH=./zephyr-sdk-0.17.0
#    docker compose up -d
#
# =============================================================================

